<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Combiner Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="macos-window">
      <!-- Toolbar -->
      <header class="macos-toolbar">
        <div class="toolbar-left"></div>

        <div class="toolbar-center"></div>

        <div class="toolbar-right">
          <button
            class="icon-btn"
            id="inspectorToggle"
            title="Toggle Inspector"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <line x1="15" y1="3" x2="15" y2="21" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Workspace -->
      <div class="macos-workspace">

        <!-- Center: Editor (Canvas) -->
        <main class="canvas-center">
          <div class="output-header" style="justify-content: flex-end">
            <button class="icon-btn" id="addListBtn" title="Add List">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
          </div>

          <!-- Word Lists Stack -->
          <div class="lists-container" id="wordListsContainer">
            <!-- Rendered by JS -->
          </div>

          <!-- Console (Results output) -->
          <div class="output-header" style="border-top: 1px solid var(--divider-color)">
            <div style="display:flex; gap:16px; align-items:center;">
              <input type="search" class="mac-input mac-search" id="searchInput" placeholder="Filter combinations" />
              <div class="output-stats">
                <span id="totalCountBadge">0</span> items • <span id="calcTimeBadge">0ms</span>
              </div>
            </div>
            <button class="mac-btn primary" id="exportBtn">Export…</button>
          </div>

          <div
            class="output-canvas"
            id="outputCanvas"
            role="region"
            aria-live="polite"
          >
            <!-- Rendered by JS -->
          </div>
        </main>

        <!-- Right: Inspector -->
        <aside class="inspector-right" id="rightInspector">
          <div class="sidebar-header" style="justify-content: space-between">
            <span>Inspector</span>
            <button
              class="icon-btn"
              id="themeToggleBtn"
              title="Toggle Theme"
              style="width: 20px; height: 20px"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Combination</div>
            <div class="inspector-row">
              <span class="inspector-label">Mode</span>
              <select class="mac-select" id="combinationModeSelect">
                <option value="cartesian">Cartesian</option>
                <option value="subsets">Subsets</option>
                <option value="zip">Zip Line-by-Line</option>
              </select>
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Separator</span>
              <select class="mac-select" id="separatorTypeSelect">
                <option value="space">Space</option>
                <option value="nothing">Nothing</option>
                <option value="custom">Custom…</option>
              </select>
            </div>
            <div class="inspector-row" id="customSepRow" hidden>
              <span class="inspector-label">Custom Char</span>
              <input
                type="text"
                class="mac-input"
                id="customSeparatorInput"
                value="-"
                style="width: 60px; text-align: center"
              />
            </div>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Formatting</div>
            <div class="inspector-row">
              <span class="inspector-label">Case</span>
              <select class="mac-select" id="caseTransformSelect">
                <option value="as-is">As-is</option>
                <option value="lower">lowercase</option>
                <option value="upper">UPPERCASE</option>
                <option value="title">Title Case</option>
                <option value="camel">camelCase</option>
                <option value="kebab">kebab-case</option>
                <option value="snake">snake_case</option>
              </select>
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Wrapper</span>
              <select class="mac-select" id="wrapperSelect">
                <option value="none">None</option>
                <option value="quotes">"Quotes"</option>
                <option value="brackets">[Brackets]</option>
                <option value="braces">{Braces}</option>
              </select>
            </div>
            <div class="inspector-row-col">
              <span class="inspector-label">Prefix</span>
              <input
                type="text"
                class="mac-input"
                id="prefixInput"
                placeholder="e.g. https://"
              />
            </div>
            <div class="inspector-row-col">
              <span class="inspector-label">Suffix</span>
              <input
                type="text"
                class="mac-input"
                id="suffixInput"
                placeholder="e.g. .com"
              />
            </div>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Cleanup</div>
            <div class="inspector-row">
              <span class="inspector-label">Remove Duplicates</span>
              <input
                type="checkbox"
                class="mac-toggle"
                id="removeDuplicatesCheckbox"
                checked
              />
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Trim Whitespace</span>
              <input
                type="checkbox"
                class="mac-toggle"
                id="trimWordsCheckbox"
                checked
              />
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Minimal script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
