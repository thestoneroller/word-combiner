<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Combiner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="macos-window">
      <!-- Toolbar -->
      <header class="macos-toolbar">
        <div class="toolbar-left"></div>

        <div class="toolbar-center"></div>

        <div class="toolbar-right">
          <button
            class="icon-btn"
            id="inspectorToggle"
            title="Toggle Inspector"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <line x1="15" y1="3" x2="15" y2="21" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Workspace -->
      <div class="macos-workspace">
        <!-- Center: Editor (Canvas) -->
        <main class="canvas-center">
          <div class="output-header" style="justify-content: flex-end">
            <button class="icon-btn" id="addListBtn" title="Add List">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
          </div>

          <!-- Word Lists Stack -->
          <div class="lists-container" id="wordListsContainer">
            <!-- Rendered by JS -->
          </div>

          <!-- Console (Results output) -->
          <div
            class="output-header"
            style="border-top: 1px solid var(--divider-color)"
          >
            <div class="output-header-left">
              <div class="selection-control-group">
                <input
                  type="checkbox"
                  class="mac-checkbox"
                  id="selectAllCheckbox"
                  title="Select All / Deselect All Filtered"
                  aria-label="Select all combinations"
                />
                <div class="mac-dropdown-wrap">
                  <button
                    class="icon-btn sm"
                    id="selectMenuBtn"
                    title="Selection Actions"
                    aria-haspopup="true"
                    aria-label="Selection options"
                  >
                    <svg
                      width="10"
                      height="10"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                    >
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>
                  <div class="mac-menu" id="selectMenu" hidden>
                    <button type="button" class="mac-menu-item" id="menuSelectAll">Select All</button>
                    <button type="button" class="mac-menu-item" id="menuDeselectAll">Deselect All</button>
                    <button type="button" class="mac-menu-item" id="menuInvertSelection">Invert Selection</button>
                  </div>
                </div>
              </div>
              <input
                type="search"
                class="mac-input mac-search"
                id="searchInput"
                placeholder="Filter combinations"
              />
              <div class="output-stats">
                <span id="totalCountBadge">0</span> items<span
                  id="selectedCountBadge"
                  class="selected-stat"
                  hidden
                > • <span id="selectedCountNum">0</span> selected</span> •
                <span id="calcTimeBadge">0ms</span>
              </div>
            </div>
            <div class="output-header-right">
              <button
                class="icon-btn"
                id="quickCopyBtn"
                title="Quick Copy (Selected / All)"
                aria-label="Copy combinations to clipboard"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                  ></path>
                </svg>
              </button>
              <button class="mac-btn primary" id="exportBtn">Export…</button>
            </div>
          </div>

          <div
            class="output-canvas"
            id="outputCanvas"
            role="region"
            aria-live="polite"
            tabindex="0"
          >
            <!-- Rendered by JS -->
          </div>
        </main>

        <!-- Right: Inspector -->
        <aside class="inspector-right" id="rightInspector">
          <div class="sidebar-header" style="justify-content: space-between">
            <span>Inspector</span>
            <button
              class="icon-btn"
              id="themeToggleBtn"
              title="Toggle Theme"
              style="width: 20px; height: 20px"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Combination</div>
            <div class="inspector-row">
              <span class="inspector-label">Mode</span>
              <select class="mac-select" id="combinationModeSelect">
                <option value="cartesian">Cartesian</option>
                <option value="subsets">Subsets</option>
                <option value="zip">Zip Line-by-Line</option>
              </select>
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Max Words</span>
              <div class="mac-stepper">
                <button
                  type="button"
                  class="mac-stepper-btn"
                  id="maxWordsDecBtn"
                  title="Decrease"
                  aria-label="Decrease max words"
                >−</button>
                <input
                  type="number"
                  class="mac-input mac-stepper-input"
                  id="maxWordsInput"
                  min="1"
                  max="50"
                  value="2"
                  placeholder="All"
                />
                <button
                  type="button"
                  class="mac-stepper-btn"
                  id="maxWordsIncBtn"
                  title="Increase"
                  aria-label="Increase max words"
                >+</button>
              </div>
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Separator</span>
              <select class="mac-select" id="separatorTypeSelect">
                <option value="space">Space</option>
                <option value="nothing">Nothing</option>
                <option value="custom">Custom…</option>
              </select>
            </div>
            <div class="inspector-row" id="customSepRow" hidden>
              <span class="inspector-label">Custom Char</span>
              <input
                type="text"
                class="mac-input"
                id="customSeparatorInput"
                value="-"
                style="width: 60px; text-align: center"
              />
            </div>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Formatting</div>
            <div class="inspector-row">
              <span class="inspector-label">Case</span>
              <select class="mac-select" id="caseTransformSelect">
                <option value="as-is">As-is</option>
                <option value="lower">lowercase</option>
                <option value="upper">UPPERCASE</option>
                <option value="title">Title Case</option>
                <option value="camel">camelCase</option>
                <option value="kebab">kebab-case</option>
                <option value="snake">snake_case</option>
              </select>
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Wrapper</span>
              <select class="mac-select" id="wrapperSelect">
                <option value="none">None</option>
                <option value="quotes">"Quotes"</option>
                <option value="brackets">[Brackets]</option>
                <option value="braces">{Braces}</option>
              </select>
            </div>
          </div>

          <div class="inspector-section">
            <div class="inspector-title">Cleanup</div>
            <div class="inspector-row">
              <span class="inspector-label">Remove Duplicates</span>
              <input
                type="checkbox"
                class="mac-toggle"
                id="removeDuplicatesCheckbox"
                checked
              />
            </div>
            <div class="inspector-row">
              <span class="inspector-label">Trim Whitespace</span>
              <input
                type="checkbox"
                class="mac-toggle"
                id="trimWordsCheckbox"
                checked
              />
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Export Modal Sheet -->
    <div class="macos-sheet-backdrop" id="exportModal" hidden>
      <div class="macos-sheet" role="dialog" aria-modal="true" aria-labelledby="exportSheetTitle">
        <div class="sheet-header">
          <span class="sheet-title" id="exportSheetTitle">Export Combinations</span>
          <button class="icon-btn" id="closeExportModalBtn" title="Close" aria-label="Close export dialog">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="sheet-body">
          <!-- Export Scope -->
          <div class="sheet-section">
            <label class="sheet-label">Scope</label>
            <div class="mac-segmented sheet-segmented" id="exportScopeSegmented">
              <button type="button" class="mac-segment active" data-scope="selected" id="scopeSelectedBtn">Selected (0)</button>
              <button type="button" class="mac-segment" data-scope="filtered" id="scopeFilteredBtn">Filtered (0)</button>
              <button type="button" class="mac-segment" data-scope="all" id="scopeAllBtn">All (0)</button>
            </div>
          </div>

          <!-- Export Format -->
          <div class="sheet-section">
            <label class="sheet-label">Format</label>
            <div class="mac-segmented sheet-segmented" id="exportFormatSegmented">
              <button type="button" class="mac-segment active" data-format="txt">Text (.txt)</button>
              <button type="button" class="mac-segment" data-format="csv">CSV (.csv)</button>
              <button type="button" class="mac-segment" data-format="xlsx">Excel (.xlsx)</button>
              <button type="button" class="mac-segment" data-format="json">JSON (.json)</button>
            </div>
          </div>

          <!-- Format-Specific Options -->
          <div class="sheet-section" id="textOptionsSection">
            <div class="sheet-row">
              <span class="sheet-label-sm">Delimiter</span>
              <select class="mac-select" id="exportDelimiterSelect">
                <option value="newline">Newline (\n)</option>
                <option value="comma">Comma (, )</option>
                <option value="tab">Tab (\t)</option>
                <option value="space">Space ( )</option>
                <option value="semicolon">Semicolon (; )</option>
                <option value="custom">Custom…</option>
              </select>
            </div>
            <div class="sheet-row" id="exportCustomDelimRow" hidden style="margin-top: 8px;">
              <span class="sheet-label-sm">Custom Delimiter</span>
              <input type="text" class="mac-input" id="exportCustomDelimInput" value=" | " style="width: 80px; text-align: center" />
            </div>
          </div>

          <div class="sheet-section" id="csvOptionsSection" hidden>
            <div class="sheet-row">
              <span class="sheet-label-sm">Include Column Header</span>
              <input type="checkbox" class="mac-toggle" id="exportHeaderToggle" checked />
            </div>
          </div>

          <!-- Preview Summary -->
          <div class="sheet-preview">
            <div class="preview-header">
              <span class="preview-title">Preview</span>
              <span class="preview-count" id="previewCountBadge">0 items</span>
            </div>
            <div class="preview-box" id="exportPreviewBox"></div>
          </div>
        </div>
        <div class="sheet-footer">
          <button type="button" class="mac-btn" id="modalCancelBtn">Cancel</button>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="mac-btn" id="modalCopyBtn">Copy to Clipboard</button>
            <button type="button" class="mac-btn primary" id="modalDownloadBtn">Download File</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="mac-toast" id="macToast" aria-live="polite">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toastMessage">Copied to clipboard</span>
    </div>

    <!-- Minimal script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
