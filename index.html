<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Advanced Word Combiner — combine unlimited word lists with separators, case transforms, and export to TXT, CSV, XLSX, Markdown, and JSON."
    />
    <title>Word Combiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <!-- Global Nav -->
    <header class="global-nav" role="banner">
      <div class="nav-inner">
        <a href="#" class="nav-brand" aria-label="Word Combiner Home">
          <div class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 7V4h16v3M9 20h6M12 4v16" />
            </svg>
          </div>
          <span class="brand-name">Word Combiner</span>
        </a>

        <div class="nav-right">
          <button
            type="button"
            id="themeToggleBtn"
            class="nav-icon-btn"
            aria-label="Toggle light/dark theme"
          >
            <span id="themeIcon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <!-- Sub-nav / Hero -->
    <section class="sub-nav-hero" aria-label="Word Combiner">
      <div class="page-container">
        <h1 class="hero-title">
          Combine <span class="hero-accent">anything.</span>
        </h1>
        <p class="hero-subtitle">
          Build unlimited word lists, pick a separator, transform case,<br />
          and export in any format — instantly.
        </p>

        <!-- Controls Bar -->
        <div class="controls-strip" aria-label="Global settings">
          <!-- Separator -->
          <div class="control-group">
            <span class="control-label" id="sep-label">Separator</span>
            <div
              class="segmented-control"
              role="radiogroup"
              aria-labelledby="sep-label"
              id="separatorSegmented"
            >
              <button
                type="button"
                class="seg-btn active"
                data-separator="space"
                aria-pressed="true"
              >
                Space
              </button>
              <button
                type="button"
                class="seg-btn"
                data-separator="nothing"
                aria-pressed="false"
              >
                Nothing
              </button>
              <button
                type="button"
                class="seg-btn"
                data-separator="custom"
                aria-pressed="false"
              >
                Custom
              </button>
            </div>
            <div class="custom-sep-wrap" id="customSeparatorWrapper" hidden>
              <input
                type="text"
                id="customSeparatorInput"
                class="compact-input"
                style="width: 68px"
                placeholder="e.g. –"
                value="-"
                aria-label="Custom separator character"
              />
            </div>
          </div>

          <!-- Presets -->
          <div class="control-group">
            <span class="control-label">Presets</span>
            <div
              class="presets-row"
              id="presetsContainer"
              role="toolbar"
              aria-label="Presets"
            ></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Studio -->
    <main class="studio-section">
      <div class="page-container">
        <div class="studio-grid">
          <!-- Left: Word Lists -->
          <div class="lists-panel">
            <div class="utility-card">
              <header class="card-header">
                <h2 class="card-title">Word Lists</h2>
                <button
                  type="button"
                  id="clearAllListsBtn"
                  class="btn-ghost-sm"
                  aria-label="Clear all word lists"
                >
                  Clear All
                </button>
              </header>

              <div
                id="wordListsContainer"
                class="lists-stack"
                aria-label="Word lists"
              >
                <!-- rendered by app.js -->
              </div>

              <footer class="card-footer">
                <button
                  type="button"
                  id="addListBtn"
                  class="btn-add-list"
                  aria-label="Add a new word list"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  Add List
                </button>
                <span class="footer-hint"
                  >Separate words with commas or new lines</span
                >
              </footer>

              <!-- Advanced Options -->
              <div class="advanced-section">
                <button
                  type="button"
                  class="advanced-toggle"
                  id="optionsToggleBtn"
                  aria-expanded="false"
                  aria-controls="optionsContent"
                >
                  <span>Advanced Options</span>
                  <svg
                    id="optionsChevron"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    style="
                      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                    "
                  >
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </button>
                <div class="advanced-content" id="optionsContent" hidden>
                  <div class="options-grid">
                    <div class="option-field">
                      <label class="field-label" for="combinationModeSelect"
                        >Mode</label
                      >
                      <select id="combinationModeSelect" class="select-input">
                        <option value="cartesian">
                          Cartesian (L1 × L2 × L3)
                        </option>
                        <option value="subsets">All Subsets</option>
                        <option value="zip">Zip / Line-by-Line</option>
                      </select>
                    </div>

                    <div class="option-field">
                      <label class="field-label" for="caseTransformSelect"
                        >Case</label
                      >
                      <select id="caseTransformSelect" class="select-input">
                        <option value="as-is">As-is</option>
                        <option value="lower">lowercase</option>
                        <option value="upper">UPPERCASE</option>
                        <option value="title">Title Case</option>
                        <option value="camel">camelCase</option>
                        <option value="kebab">kebab-case</option>
                        <option value="snake">snake_case</option>
                      </select>
                    </div>

                    <div class="option-field">
                      <label class="field-label" for="wrapperSelect"
                        >Wrap Each</label
                      >
                      <select id="wrapperSelect" class="select-input">
                        <option value="none">None</option>
                        <option value="quotes">"Double Quotes"</option>
                        <option value="single-quotes">'Single Quotes'</option>
                        <option value="brackets">[Brackets]</option>
                        <option value="braces">{Braces}</option>
                        <option value="parentheses">(Parentheses)</option>
                      </select>
                    </div>

                    <div class="option-field">
                      <label class="field-label" for="prefixInput"
                        >Prefix</label
                      >
                      <input
                        type="text"
                        id="prefixInput"
                        class="compact-input"
                        placeholder="e.g. # or https://"
                      />
                    </div>

                    <div class="option-field">
                      <label class="field-label" for="suffixInput"
                        >Suffix</label
                      >
                      <input
                        type="text"
                        id="suffixInput"
                        class="compact-input"
                        placeholder="e.g. .com or !"
                      />
                    </div>

                    <div class="option-field toggles-field">
                      <label class="toggle-row">
                        <input
                          type="checkbox"
                          id="removeDuplicatesCheckbox"
                          checked
                        />
                        <span class="toggle-label-text">Remove Duplicates</span>
                      </label>
                      <label class="toggle-row">
                        <input type="checkbox" id="trimWordsCheckbox" checked />
                        <span class="toggle-label-text">Trim Whitespace</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right: Output -->
          <div class="output-panel">
            <div class="output-sticky utility-card">
              <header class="card-header">
                <h2 class="card-title">Results</h2>
                <div
                  class="stats-row"
                  role="status"
                  aria-live="polite"
                  aria-atomic="true"
                >
                  <span class="stat-chip">
                    <strong id="totalCountBadge">0</strong> results
                  </span>
                  <span class="stat-chip">
                    <strong id="calcTimeBadge">0 ms</strong>
                  </span>
                </div>
              </header>

              <!-- Search -->
              <div class="search-wrap">
                <svg
                  class="search-ico"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  type="search"
                  id="searchInput"
                  class="search-input"
                  placeholder="Filter results…"
                  aria-label="Filter results"
                />
              </div>

              <!-- Output Canvas -->
              <div
                class="output-canvas"
                id="outputCanvas"
                role="region"
                aria-label="Generated combinations"
                aria-live="polite"
              ></div>

              <!-- Export Bar -->
              <div class="export-bar">
                <button
                  type="button"
                  id="copyBtn"
                  class="btn-primary"
                  title="Copy all (Cmd+Shift+C)"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                    <path
                      d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                    />
                  </svg>
                  Copy All
                </button>

                <div class="dropdown-wrap">
                  <button
                    type="button"
                    id="exportDropdownBtn"
                    class="btn-secondary"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                      <polyline points="7 10 12 15 17 10" />
                      <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Export
                    <svg
                      width="10"
                      height="10"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="6 9 12 15 18 9" />
                    </svg>
                  </button>

                  <div class="dropdown-menu" id="exportMenu" role="menu" hidden>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="download-txt"
                      role="menuitem"
                    >
                      Plain Text (.txt)
                    </button>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="download-csv"
                      role="menuitem"
                    >
                      CSV Spreadsheet (.csv)
                    </button>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="download-xlsx"
                      role="menuitem"
                    >
                      Excel Workbook (.xlsx)
                    </button>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="download-md"
                      role="menuitem"
                    >
                      Markdown Table (.md)
                    </button>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="download-json"
                      role="menuitem"
                    >
                      JSON Array (.json)
                    </button>
                    <div class="menu-divider" role="separator"></div>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="copy-comma"
                      role="menuitem"
                    >
                      Copy Comma-Separated
                    </button>
                    <button
                      type="button"
                      class="menu-item"
                      data-action="copy-json"
                      role="menuitem"
                    >
                      Copy JSON Array
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast Region -->
    <div
      class="toast-region"
      id="toastContainer"
      aria-live="assertive"
      aria-atomic="true"
    ></div>

    <script src="app.js"></script>
  </body>
</html>
