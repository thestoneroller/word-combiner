<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Advanced Apple-designed Word Combiner tool. Combine unlimited word lists with Space, Nothing, or Custom separators, case transforms, deduplication, and export to TXT, CSV, XLSX, MD, and JSON."
    />
    <title>Word Combiner Studio</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- SheetJS for seamless XLSX export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <!-- Top Floating Glass Navigation Header -->
    <header class="glass-header">
      <div class="app-container">
        <div class="header-inner">
          <a href="#" class="logo-group">
            <div class="logo-badge">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 7V4h16v3M9 20h6M12 4v16" />
              </svg>
            </div>
            <div>
              <span class="logo-title">Word Combiner</span>
              <span class="logo-subtitle">Pro</span>
            </div>
          </a>

          <div class="header-actions">
            <button
              type="button"
              class="btn btn-secondary btn-icon"
              id="themeToggleBtn"
              title="Toggle Light/Dark Theme"
              aria-label="Toggle Theme"
            >
              <span id="themeIcon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  ></path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper">
      <div class="app-container">
        <!-- Hero Header -->
        <section class="app-hero">
          <h1 class="hero-title">Craft <span>Effortless Combinations</span></h1>
          <p class="hero-desc">
            Create unlimited word lists, choose separators, apply case
            transforms, and export in any format with high performance.
          </p>
        </section>

        <!-- Top Control Toolbar: Separators & Quick Presets -->
        <section class="control-toolbar">
          <!-- Separator Controls -->
          <div class="toolbar-section">
            <span class="section-label">Separator:</span>
            <div
              class="segmented-control"
              id="separatorSegmented"
              role="radiogroup"
              aria-label="Word Separator"
            >
              <button
                type="button"
                class="segment-btn active"
                data-separator="space"
              >
                Space
              </button>
              <button
                type="button"
                class="segment-btn"
                data-separator="nothing"
              >
                Nothing
              </button>
              <button type="button" class="segment-btn" data-separator="custom">
                Custom
              </button>
            </div>

            <!-- Custom Separator Input (Toggled when Custom is chosen) -->
            <div class="custom-separator-input" id="customSeparatorWrapper">
              <input
                type="text"
                id="customSeparatorInput"
                class="input-text"
                style="width: 80px"
                placeholder="e.g. - or _"
                value="-"
                title="Custom Separator Character"
              />
            </div>
          </div>

          <!-- Presets Section -->
          <div class="toolbar-section">
            <span class="section-label">Presets:</span>
            <div class="presets-group" id="presetsContainer">
              <!-- Dynamically rendered preset chips -->
            </div>
          </div>
        </section>

        <!-- 2-Column Studio Grid -->
        <div class="studio-grid">
          <!-- Left Column: Dynamic Word Lists & Advanced Options -->
          <div class="lists-panel">
            <div class="panel-card">
              <div class="panel-header">
                <div class="panel-title">
                  <span>Word Lists</span>
                  <span class="badge">Dynamic</span>
                </div>
                <button
                  type="button"
                  class="btn btn-ghost btn-sm"
                  id="clearAllListsBtn"
                  title="Clear all text in all lists"
                >
                  Clear All
                </button>
              </div>

              <!-- Container for all dynamic word lists -->
              <div class="word-lists-container" id="wordListsContainer">
                <!-- Word list cards inserted by app.js -->
              </div>

              <!-- Add List Button Bar -->
              <div class="add-list-bar">
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  id="addListBtn"
                >
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>Add Another List</span>
                </button>
                <span style="font-size: 0.8rem; color: var(--text-secondary)"
                  >Separate words with commas or newlines</span
                >
              </div>

              <!-- Advanced Options Accordion -->
              <div class="options-section">
                <button
                  type="button"
                  class="options-toggle"
                  id="optionsToggleBtn"
                >
                  <span>Advanced Options & Transforms</span>
                  <svg
                    id="optionsChevron"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="transition: transform 0.2s ease"
                  >
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>

                <div class="options-content" id="optionsContent">
                  <!-- Combination Mode -->
                  <div class="option-box">
                    <label for="combinationModeSelect">Mode</label>
                    <select id="combinationModeSelect" class="select-custom">
                      <option value="cartesian">
                        Cartesian Product (L1 × L2 × L3)
                      </option>
                      <option value="subsets">
                        All Subset Combinations (2, 3, etc.)
                      </option>
                      <option value="zip">Zip / Line-by-Line</option>
                    </select>
                  </div>

                  <!-- Case Conversion -->
                  <div class="option-box">
                    <label for="caseTransformSelect">Case Format</label>
                    <select id="caseTransformSelect" class="select-custom">
                      <option value="as-is">As-is (Original)</option>
                      <option value="lower">lowercase</option>
                      <option value="upper">UPPERCASE</option>
                      <option value="title">Title Case</option>
                      <option value="camel">camelCase</option>
                      <option value="kebab">kebab-case</option>
                      <option value="snake">snake_case</option>
                    </select>
                  </div>

                  <!-- Wrapper -->
                  <div class="option-box">
                    <label for="wrapperSelect">Wrap Each Result</label>
                    <select id="wrapperSelect" class="select-custom">
                      <option value="none">None</option>
                      <option value="quotes">"Double Quotes"</option>
                      <option value="single-quotes">'Single Quotes'</option>
                      <option value="brackets">[Brackets]</option>
                      <option value="braces">{Braces}</option>
                      <option value="parentheses">(Parentheses)</option>
                    </select>
                  </div>

                  <!-- Prefix -->
                  <div class="option-box">
                    <label for="prefixInput">Prefix</label>
                    <input
                      type="text"
                      id="prefixInput"
                      class="input-text"
                      placeholder="e.g. # or https://"
                    />
                  </div>

                  <!-- Suffix -->
                  <div class="option-box">
                    <label for="suffixInput">Suffix</label>
                    <input
                      type="text"
                      id="suffixInput"
                      class="input-text"
                      placeholder="e.g. .com or !"
                    />
                  </div>

                  <!-- Deduplication & Trimming Toggles -->
                  <div class="option-box" style="justify-content: flex-end">
                    <label class="checkbox-label">
                      <input
                        type="checkbox"
                        id="removeDuplicatesCheckbox"
                        checked
                      />
                      <span>Remove Duplicates</span>
                    </label>
                    <label class="checkbox-label">
                      <input type="checkbox" id="trimWordsCheckbox" checked />
                      <span>Trim Whitespace</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Column: Output & Export Canvas -->
          <div class="results-column">
            <div class="panel-card results-panel">
              <div class="results-header">
                <div class="panel-title">
                  <span>Generated Combinations</span>
                </div>
                <div class="results-stats-row">
                  <div class="stat-pill" title="Total combinations generated">
                    <span id="totalCountBadge" class="stat-number">0</span>
                    <span>results</span>
                  </div>
                  <div class="stat-pill" title="Calculation speed">
                    <span id="calcTimeBadge" class="stat-number">0 ms</span>
                  </div>
                </div>
              </div>

              <!-- Search Bar inside results -->
              <div class="search-box">
                <svg
                  class="search-icon"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Filter results in real-time..."
                />
              </div>

              <!-- Output Results Display Box -->
              <div
                class="output-canvas"
                id="outputCanvas"
                role="region"
                aria-label="Generated Combinations"
              >
                <!-- Generated items rendered by app.js -->
              </div>

              <!-- Export and Copy Toolbar -->
              <div class="export-toolbar">
                <button
                  type="button"
                  class="btn btn-primary"
                  id="copyBtn"
                  title="Copy all combinations (⌘+Shift+C)"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect
                      x="9"
                      y="9"
                      width="13"
                      height="13"
                      rx="2"
                      ry="2"
                    ></rect>
                    <path
                      d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                    ></path>
                  </svg>
                  <span>Copy All Results</span>
                </button>

                <!-- Export Format Dropdown -->
                <div class="export-dropdown-wrapper">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    id="exportDropdownBtn"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    <svg
                      width="15"
                      height="15"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                      ></path>
                      <polyline points="7 10 12 15 17 10"></polyline>
                      <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Export</span>
                    <svg
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                    >
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>

                  <div class="export-menu" id="exportMenu" role="menu">
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="download-txt"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                        ></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                      </svg>
                      <span>Plain Text (.txt)</span>
                    </button>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="download-csv"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                        ></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="16" y2="17"></line>
                      </svg>
                      <span>CSV Spreadsheet (.csv)</span>
                    </button>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="download-xlsx"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <rect
                          x="3"
                          y="3"
                          width="18"
                          height="18"
                          rx="2"
                          ry="2"
                        ></rect>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                      </svg>
                      <span>Excel Workbook (.xlsx)</span>
                    </button>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="download-md"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"
                        ></path>
                        <polyline points="7 15 7 9 10 12 13 9 13 15"></polyline>
                        <polyline points="18 12 18 15 15 15"></polyline>
                      </svg>
                      <span>Markdown Table (.md)</span>
                    </button>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="download-json"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                      </svg>
                      <span>JSON Object (.json)</span>
                    </button>
                    <div
                      style="
                        border-top: 1px solid var(--border-light);
                        margin: 0.25rem 0;
                      "
                    ></div>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="copy-comma"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                      </svg>
                      <span>Copy Comma-Separated</span>
                    </button>
                    <button
                      type="button"
                      class="export-menu-item"
                      data-action="copy-json"
                      role="menuitem"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                      </svg>
                      <span>Copy JSON Array</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast Notification Anchor -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Main Logic Script -->
    <script src="app.js"></script>
  </body>
</html>
